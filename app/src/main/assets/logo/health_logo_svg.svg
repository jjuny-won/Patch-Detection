<svg width="100%" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Glow filter for ECG line -->
    <filter id="ecg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="heart-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Animated ECG dash -->
    
  </defs>

  <!-- Background: transparent -->

  <!-- === HEART (perfect symmetric, centered at 200,138) === -->
  <!-- Heart drawn as two arcs + bottom V, width=110, height=100 -->
  <g filter="url(#heart-glow)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <!-- Left half of heart -->
    <path d="M200,175&#10;         C180,158 145,145 145,118&#10;         C145,102 157,92 170,92&#10;         C182,92 192,100 200,110" stroke="#E83254" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" style="fill:none;stroke:rgb(232, 50, 84);color:rgb(0, 0, 0);stroke-width:6px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- Right half of heart — top arc only (ECG exits here) -->
    <path d="M200,110&#10;         C208,100 218,92 230,92&#10;         C243,92 255,102 255,118&#10;         C255,128 250,136 244,144" stroke="#E83254" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" style="fill:none;stroke:rgb(232, 50, 84);color:rgb(0, 0, 0);stroke-width:6px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- Right half bottom — from where ECG re-enters -->
    <path d="M222,163&#10;         C215,170 208,176 200,183&#10;         L200,175" stroke="#E83254" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" style="fill:none;stroke:rgb(232, 50, 84);color:rgb(0, 0, 0);stroke-width:6px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- === ECG LINE (exits right side of heart, spikes, re-enters) === -->
  <!-- Starts at left flat, enters heart area, exits right at (244,144), spikes up/down, continues flat -->
  <path d="M60,144&#10;       L186,144&#10;       L190,144&#10;       L244,144&#10;       L252,144&#10;       L258,132&#10;       L264,162&#10;       L270,110&#10;       L276,162&#10;       L282,144&#10;       L296,144&#10;       L340,144" stroke="#FF5A6E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#ecg-glow)" style="fill:none;stroke:rgb(255, 90, 110);color:rgb(0, 0, 0);stroke-width:3.5px;stroke-dasharray:600px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Pulse dot at end -->
  <circle cx="340" cy="144" r="3" fill="#FF5A6E" style="fill:rgb(255, 90, 110);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.730271;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>